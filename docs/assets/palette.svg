<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="JetBrains Mono, ui-monospace, monospace">
  <rect width="860" height="360" rx="14" fill="#060a0f" stroke="#1e2a33"/>

  <!-- dimmed page content behind the overlay -->
  <g fill="#1e2a33" opacity="0.55">
    <rect x="60" y="50" width="320" height="10" rx="5"/>
    <rect x="60" y="70" width="190" height="10" rx="5"/>
    <rect x="60" y="290" width="250" height="10" rx="5"/>
    <rect x="60" y="310" width="150" height="10" rx="5"/>
    <rect x="660" y="50" width="140" height="10" rx="5"/>
    <rect x="660" y="310" width="80" height="10" rx="5"/>
  </g>
  <rect width="860" height="360" rx="14" fill="rgba(3,6,9,0.55)"/>

  <!-- palette box -->
  <rect x="180" y="70" width="500" height="252" rx="10" fill="#010409" stroke="#39d353" stroke-opacity="0.45"/>

  <!-- input row -->
  <text x="200" y="105" font-size="15" fill="#e6edf3"><tspan fill="#39d353">&gt;_</tspan> projects</text>
  <rect x="290" y="90" width="9" height="17" fill="#39d353">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <rect x="632" y="89" width="36" height="18" rx="4" fill="#10161d" stroke="#1e2a33"/>
  <text x="650" y="102" font-size="10" fill="#8b949e" text-anchor="middle">esc</text>
  <line x1="180" y1="118" x2="680" y2="118" stroke="#1e2a33"/>

  <!-- items -->
  <rect x="188" y="128" width="484" height="30" rx="7" fill="rgba(57,211,83,0.12)"/>
  <text x="202" y="148" font-size="12.5" fill="#9fefc0">cd ~/projects</text>
  <text x="658" y="148" font-size="10.5" fill="#4a5568" text-anchor="end">[section]</text>

  <text x="202" y="178" font-size="12.5" fill="#c9d1d9">cd ~/skills</text>
  <text x="658" y="178" font-size="10.5" fill="#4a5568" text-anchor="end">[section]</text>

  <text x="202" y="208" font-size="12.5" fill="#c9d1d9">open https://github.com/mhjahed</text>
  <text x="658" y="208" font-size="10.5" fill="#4a5568" text-anchor="end">[external]</text>

  <text x="202" y="238" font-size="12.5" fill="#c9d1d9">mail mhjahed@proton.me</text>
  <text x="658" y="238" font-size="10.5" fill="#4a5568" text-anchor="end">[compose]</text>

  <text x="202" y="268" font-size="12.5" fill="#c9d1d9">download resume.pdf</text>
  <text x="658" y="268" font-size="10.5" fill="#4a5568" text-anchor="end">[file]</text>

  <!-- footer -->
  <line x1="180" y1="290" x2="680" y2="290" stroke="#1e2a33"/>
  <text x="430" y="311" font-size="10.5" fill="#8b949e" text-anchor="middle">
    <tspan fill="#e6edf3">↑↓</tspan> navigate    <tspan fill="#e6edf3">↵</tspan> run    <tspan fill="#e6edf3">esc</tspan> close
  </text>
</svg>
