<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="JetBrains Mono, ui-monospace, monospace">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="rgba(57,211,83,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="860" height="430" rx="14" fill="#0d1117" stroke="#1e2a33"/>
  <rect x="1" y="1" width="858" height="428" rx="13" fill="url(#grid)"/>

  <!-- left: hero copy -->
  <text x="40" y="62" font-size="15" fill="#c9d1d9">
    <tspan fill="#39d353">mhjahed@sylhet:~$</tspan> whoami
  </text>
  <text x="40" y="112" font-size="31" font-weight="800" fill="#e6edf3">MOKSOOD HOSSEN</text>
  <text x="40" y="152" font-size="31" font-weight="800" fill="#39d353">JAHED</text>
  <rect x="178" y="126" width="10" height="32" fill="#39d353">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="40" y="190" font-size="17" font-weight="600" fill="#9fefc0">&gt; Back-End Developer</text>
  <text x="40" y="216" font-size="12" fill="#8b949e">django + react · real-time apps · security-first</text>

  <!-- buttons -->
